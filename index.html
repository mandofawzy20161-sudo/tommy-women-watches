const WA="201011926183",TEL="01011926183";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function card(p){
  const idx=P.indexOf(p);
  const img=p.images[0]||"";
  return `<div class="card">
    <div class="badges"><span class="badge">ORIGINAL</span>${p.stock?'':'<span class="badge out">غير متوفر</span>'}</div>
    <img class="card-img" loading="lazy" src="${img}" alt="${esc(p.name)}" onclick="openP(${idx})" onerror="this.style.opacity='.2'">
    <div class="name">${esc(p.name)}</div>
    <div class="model">${esc(p.model)}</div>
    <div class="price">${Math.round(p.price)} جنيه</div>
    <div class="note">🚚 التوصيل مجاني</div>
    <div class="note">📦 يوجد معاينة للمنتج قبل الاستلام</div>
    <button class="details" onclick="openP(${idx})">تفاصيل</button>
    ${p.stock?`<a class="wa" target="_blank" href="https://wa.me/${WA}?text=${encodeURIComponent('أريد طلب ساعة Tommy Hilfiger حريمي موديل '+p.model+' بسعر '+Math.round(p.price)+' جنيه')}">اطلب عبر واتساب</a>`:'<span class="wa disabled">غير متوفر حاليًا</span>'}
  </div>`;
}
function render(list=P){document.getElementById("grid").innerHTML=list.map(card).join("")}
document.getElementById("q").oninput=e=>{
  const s=e.target.value.trim().toLowerCase();
  render(P.filter(p=>(p.name+" "+p.model).toLowerCase().includes(s)));
};
function changeImage(btn,src){
  const m=document.getElementById("mainProductImage");
  if(m)m.src=src;
  document.querySelectorAll(".thumb").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
}
function openP(i){
  const p=P[i], ims=p.images.length?p.images:[""];
  document.getElementById("catalog").style.display="none";
  const d=document.getElementById("detail");
  d.style.display="block";
  d.innerHTML=`<button class="back" onclick="back()">← رجوع للمنتجات</button>
    <img id="mainProductImage" class="mainimg" src="${ims[0]}" alt="${esc(p.name)}">
    <div class="thumbs">${ims.map((x,j)=>`<button class="thumb ${j===0?'active':''}" onclick="changeImage(this,'${x}')"><img loading="lazy" src="${x}" alt="صورة ${j+1}"></button>`).join("")}</div>
    <h2>${esc(p.name)}</h2>
    <div class="price">${Math.round(p.price)} جنيه</div>
    ${p.stock?'':'<div class="out-msg">هذا الموديل غير متوفر حاليًا</div>'}
    <table>${p.specs.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>
    ${p.stock?`<a class="wa" target="_blank" href="https://wa.me/${WA}?text=${encodeURIComponent('أريد طلب ساعة Tommy Hilfiger حريمي موديل '+p.model+' بسعر '+Math.round(p.price)+' جنيه')}">اطلب عبر واتساب</a>`:''}
    <a class="phone" href="tel:${TEL}">☎ اطلب عن طريق الهاتف — ${TEL}</a>`;
  scrollTo(0,0);
}
function back(){
  document.getElementById("detail").style.display="none";
  document.getElementById("catalog").style.display="block";
  scrollTo(0,0);
}
render();
</script>
